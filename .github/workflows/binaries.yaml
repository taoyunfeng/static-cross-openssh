name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - ci
  schedule:
    - cron: "0 0 15 * *"

jobs:
  build:
    strategy:
      matrix:
        config:
          - arch: aarch64
            config: ARCH=aarch64 PREFIX=/data/local/openssh SYSCONFDIR=/data/local/etc/ssh __all__/VERSION=latest
            description: aarch64-android

    env:
      MAKEFLAGS: SHELL=/usr/bin/bash

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y upx

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      - name: Build
        run: |
          make config ${{ matrix.config.config }}
          make -j${{ steps.cpu-cores.outputs.count }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-binaries-for-${{ matrix.config.description }}
          path: |
            output/${{ matrix.config.arch }}/bin/
